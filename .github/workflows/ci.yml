# Kiểm tra tự động mỗi lần đẩy code: kiểu dữ liệu (TypeScript) của API, build web và CMS;
# với pull request: phần nào có thay đổi phải tăng phiên bản (scripts/check-versions.mjs).
# Kết quả xem ở tab Actions trên GitHub (Claude đọc được qua `gh run view`).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần lịch sử nhánh gốc để so phiên bản
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra đã tăng phiên bản (chỉ với pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/check-versions.mjs origin/${{ github.base_ref }}
      - name: Cài thư viện (npm workspaces)
        run: npm install --no-audit --no-fund
      - name: Build gói dùng chung (ra JavaScript, như trên Vercel)
        run: npm run build -w @check-attendance/shared
      - name: Kiểm tra kiểu API
        run: npm run typecheck -w @check-attendance/api
      - name: Kiểm tra kiểu gói dùng chung
        run: npm run typecheck -w @check-attendance/shared --if-present
      - name: Build web
        run: npm run build -w @check-attendance/web
        env:
          AUTH_SECRET: ci-only-not-a-real-secret
      - name: Build CMS
        run: npm run build -w @check-attendance/cms
        env:
          AUTH_SECRET: ci-only-not-a-real-secret
