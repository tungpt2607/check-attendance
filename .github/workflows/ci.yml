# Kiểm tra tự động mỗi lần đẩy code: kiểu dữ liệu (TypeScript) của API, build web và CMS,
# kiểm thử API với MongoDB thật (chạy kèm trong CI, database riêng, xóa khi xong),
# kiểm thử đầu-cuối bằng trình duyệt (e2e/: web + API + MongoDB + camera giả);
# với pull request: phần nào có thay đổi phải tăng phiên bản (scripts/check-versions.mjs).
# Kết quả xem ở tab Actions trên GitHub (Claude đọc được qua `gh run view`).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # MongoDB thật chỉ dùng cho kiểm thử (không phải database của web)
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần lịch sử nhánh gốc để so phiên bản
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra đã tăng phiên bản (chỉ với pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/check-versions.mjs origin/${{ github.base_ref }}
      - name: Cài thư viện (npm workspaces)
        run: npm install --no-audit --no-fund
      - name: Build gói dùng chung (ra JavaScript, như trên Vercel)
        run: npm run build -w @check-attendance/shared
      - name: Kiểm tra kiểu API
        run: npm run typecheck -w @check-attendance/api
      - name: Kiểm thử API (cách tính chuyên cần, các API với MongoDB thật)
        run: npm test -w @check-attendance/api
      - name: Kiểm tra kiểu gói dùng chung
        run: npm run typecheck -w @check-attendance/shared --if-present
      - name: Build web
        run: npm run build -w @check-attendance/web
        env:
          AUTH_SECRET: ci-only-not-a-real-secret
          # Bản build này dùng luôn cho kiểm thử đầu-cuối (API chạy ở máy CI)
          NEXT_PUBLIC_API_URL: http://localhost:8787
      - name: Build CMS
        run: npm run build -w @check-attendance/cms
        env:
          AUTH_SECRET: ci-only-not-a-real-secret
      - name: Cài trình duyệt và ffmpeg cho kiểm thử đầu-cuối
        # Thường ~1 phút; máy chủ tải gói bị treo thì dừng sớm thay vì chờ tới giới hạn 6 giờ của GitHub
        timeout-minutes: 8
        run: |
          npx -w @check-attendance/e2e playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Kiểm thử đầu-cuối (trình duyệt + API + MongoDB + camera giả)
        timeout-minutes: 15
        run: npm run test:e2e
      - name: Lưu báo cáo kiểm thử đầu-cuối khi lỗi (ảnh chụp, trace)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
